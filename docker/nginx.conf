# Local production test only. On AWS, CloudFront and S3 do this job.
server {
    listen 80;
    root /usr/share/nginx/html;

    # /api goes to the API container
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI calls can take a while
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # File names in /assets have a hash, so the browser can keep them for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Any other path is a page of the React app. The browser must not keep index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
